<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Todo List</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container py-5">
      <div class="card shadow-sm mx-auto" style="max-width: 650px">
        <div class="card-body p-4">
          <h1 class="text-center mb-4">My Todo List</h1>

          <button class="btn btn-primary mb-4" onclick="openAddModal()">
            + Add Todo
          </button>

          <div id="display"></div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="todoModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Add Todo</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <input
              type="text"
              id="modalTodo"
              class="form-control"
              placeholder="Enter a todo"
            />
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button type="button" class="btn btn-primary" onclick="saveTodo()">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let todoArr = [];
      let editingIndex = -1;

      let todoModal = new bootstrap.Modal(document.getElementById("todoModal"));

      function openAddModal() {
        editingIndex = -1;

        document.getElementById("modalTitle").innerText = "Add Todo";
        document.getElementById("modalTodo").value = "";

        todoModal.show();
      }

      function saveTodo() {
        let todo = document.getElementById("modalTodo").value.trim();

        if (!todo) {
          alert("Please enter a todo");
          return;
        }

        if (editingIndex === -1) {
          todoArr.push(todo);
        } else {
          todoArr.splice(editingIndex, 1, todo);
        }

        document.getElementById("modalTodo").value = "";

        todoModal.hide();
        displayTodos();

        console.log(todoArr);
      }

      function displayTodos() {
        document.getElementById("display").innerHTML = "";

        for (let index = 0; index < todoArr.length; index++) {
          document.getElementById("display").innerHTML += `
          <div class="d-flex justify-content-between align-items-center
                      border rounded bg-white p-3 mb-2">

            <span>${todoArr[index]}</span>

            <div class="ms-2 text-nowrap">
              <button class="btn btn-warning btn-sm"
                      onclick="editTodo(${index})">
                Edit
              </button>

              <button class="btn btn-danger btn-sm"
                      onclick="removeTodo(${index})">
                Delete
              </button>
            </div>

          </div>
        `;
        }
      }

      function editTodo(index) {
        editingIndex = index;

        document.getElementById("modalTitle").innerText = "Edit Todo";
        document.getElementById("modalTodo").value = todoArr[index];

        todoModal.show();
      }

      function removeTodo(index) {
        todoArr.splice(index, 1);
        displayTodos();
      }
    </script>
  </body>
</html>
